body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FAF7F0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  display: flex; flex-direction: column;
}
p, h1, ul { margin: 0; }
</style>
</head>
<body>
  <div style="position: absolute; left: 0; top: 0; width: 8pt; height: 405pt; background: #1B4332;"></div>
  <div style="position: absolute; left: 0; top: 138pt; width: 8pt; height: 267pt; background: #E8A33D;"></div>
  <img src="../../icons/hex-corner.png" style="position: absolute; right: 0; top: 0; width: 180pt; height: 150pt;">
  <div style="margin: 16pt 40pt 0 40pt; width: 640pt; min-height: 34pt; display: flex; align-items: center;">
    <img src="../../icons/LuPenLine-1B4332.png" style="width: 16pt; height: 16pt;">
    <div style="background: #E8A33D; border-radius: 3pt; margin-left: 8pt; display: flex; justify-content: center;">
      <p style="color: #FFFFFF; font-size: 10pt; font-weight: bold; margin: 2.5pt 7pt;">主题 2 · 典例与练习</p>
    </div>
    <h1 style="color: #1B4332; font-size: 24pt; font-weight: bold; margin-left: 12pt; width: 470pt; line-height: 1.3;">典例 2</h1>
  </div>
  <div style="position: relative; margin: 4pt 40pt 0 40pt; width: 640pt; height: 2.5pt;">
    <div style="position: absolute; left: 0; top: 0.75pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
    <div style="position: absolute; left: 0; top: 0; width: 44pt; height: 2.5pt; background: #E8A33D;"></div>
  </div>
  <div style="position: relative; margin: 10pt 40pt 0 40pt; width: 640pt; flex: 1;">
    <div style="background: #FFFFFF; border: 1pt solid #DDD6C8; border-left: 5pt solid #1B4332; border-radius: 4pt;">
      <p style="color: #1F2937; font-size: 13pt; line-height: 1.5; margin: 9pt 14pt;">【典例2】将下列各组物质分类正确的是（　　）</p>
    </div>
    <p style="color: #1F2937; font-size: 13pt; line-height: 1.7; margin-top: 8pt; width: 620pt;">A．酸：硫酸、醋酸、NaHSO₄、硝酸</p>
    <p style="color: #1F2937; font-size: 13pt; line-height: 1.7; width: 620pt;">B．同素异形体：金刚石、石墨、C₆₀、无定形碳</p>
    <p style="color: #1F2937; font-size: 13pt; line-height: 1.7; width: 620pt;">C．盐：生石灰、硝酸钾、CaCO₃、苛性钠</p>
    <p style="color: #1F2937; font-size: 13pt; line-height: 1.7; width: 620pt;">D．碱：纯碱、烧碱、乙醇、熟石灰</p>
    <div style="display: flex; margin-top: 8pt; align-items: center;">
        <div style="background: #E8A33D; border-radius: 6pt; width: 132pt; display: flex; justify-content: center; align-items: center;"><p style="color: #1B4332; font-size: 14pt; font-weight: bold; margin: 6pt 8pt; width: 116pt; text-align: center;">答案：B</p></div>
    </div>
    <div style="margin-top: 8pt; background: #E3EDE6; border-radius: 5pt;">
      <p style="color: #1F2937; font-size: 11pt; line-height: 1.5; margin: 8pt 14pt;">【解析】A．酸是电离出的阳离子都是氢离子的物质，NaHSO₄不是酸，故A错误；B．同素异形体是同种元素形成的不同单质，金刚石、石墨、C₆₀、无定形碳都是碳元素形成的不同单质，故B正确；C．生石灰是氧化物，不是盐，故C错误；D．纯碱为盐，乙醇是有机物不是碱，故D错误；故选B。</p>
    </div>
  </div>
  <div style="position: absolute; left: 40pt; top: 384pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
  <p style="position: absolute; right: 40pt; top: 388pt; width: 80pt; text-align: right; color: #6B7280; font-size: 10pt;">22 / 30</p>
