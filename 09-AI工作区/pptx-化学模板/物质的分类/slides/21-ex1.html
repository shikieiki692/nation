body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FAF7F0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  display: flex; flex-direction: column;
}
p, h1, ul { margin: 0; }
</style>
</head>
<body>
  <div style="position: absolute; left: 0; top: 0; width: 8pt; height: 405pt; background: #1B4332;"></div>
  <div style="position: absolute; left: 0; top: 150pt; width: 8pt; height: 255pt; background: #E8A33D;"></div>
  <img src="../../icons/hex-corner.png" style="position: absolute; right: 0; top: 0; width: 180pt; height: 150pt;">
  <div style="margin: 16pt 40pt 0 40pt; width: 640pt; min-height: 34pt; display: flex; align-items: center;">
    <img src="../../icons/LuPenLine-1B4332.png" style="width: 16pt; height: 16pt;">
    <div style="background: #E8A33D; border-radius: 3pt; margin-left: 8pt; display: flex; justify-content: center;">
      <p style="color: #FFFFFF; font-size: 10pt; font-weight: bold; margin: 2.5pt 7pt;">主题 2 · 典例与练习</p>
    </div>
    <h1 style="color: #1B4332; font-size: 24pt; font-weight: bold; margin-left: 12pt; width: 470pt; line-height: 1.3;">典例 1</h1>
  </div>
  <div style="position: relative; margin: 4pt 40pt 0 40pt; width: 640pt; height: 2.5pt;">
    <div style="position: absolute; left: 0; top: 0.75pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
    <div style="position: absolute; left: 0; top: 0; width: 44pt; height: 2.5pt; background: #E8A33D;"></div>
  </div>
  <div style="position: relative; margin: 10pt 40pt 0 40pt; width: 640pt; flex: 1;">
    <div style="background: #FFFFFF; border: 1pt solid #DDD6C8; border-left: 5pt solid #1B4332; border-radius: 4pt;">
      <p style="color: #1F2937; font-size: 13pt; line-height: 1.5; margin: 9pt 14pt;">【典例1】下列各组物质，按化合物、单质、混合物的顺序排列的是（　　）</p>
    </div>
    <p style="color: #1F2937; font-size: 13pt; line-height: 1.7; margin-top: 8pt; width: 620pt;">A．干冰、铁、氯化氢　　B．生石灰、白磷、熟石灰</p>
    <p style="color: #1F2937; font-size: 13pt; line-height: 1.7; width: 620pt;">C．烧碱、液态氧、碘酒　　D．空气、氮气、胆矾</p>
    <div style="display: flex; margin-top: 8pt; align-items: center;">
        <div style="background: #E8A33D; border-radius: 6pt; width: 132pt; display: flex; justify-content: center; align-items: center;"><p style="color: #1B4332; font-size: 14pt; font-weight: bold; margin: 6pt 8pt; width: 116pt; text-align: center;">答案：C</p></div>
    </div>
    <div style="margin-top: 8pt; background: #E3EDE6; border-radius: 5pt;">
      <p style="color: #1F2937; font-size: 11pt; line-height: 1.5; margin: 8pt 14pt;">【解析】A．氯化氢是纯净物，不是混合物，A项错误；B．熟石灰是纯净物，不是混合物，B项错误；C．烧碱的化学式为NaOH，属于化合物；液态氧的化学式为O₂，属于单质；碘酒是碘的酒精溶液，属于混合物。C项正确；D．空气是由N₂、O₂等气体组成的混合物，不是化合物，胆矾是纯净物不是混合物，D项错误。</p>
    </div>
  </div>
  <div style="position: absolute; left: 40pt; top: 384pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
  <p style="position: absolute; right: 40pt; top: 388pt; width: 80pt; text-align: right; color: #6B7280; font-size: 10pt;">21 / 30</p>
