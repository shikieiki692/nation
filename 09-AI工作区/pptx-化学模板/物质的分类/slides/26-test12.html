        <p style="color: #1F2937; font-size: 11.5pt; line-height: 1.5; margin: 0 14pt;">1．Na₂CO₃、NaCl、NaOH、Na₂SO₄可按某种标准划分为一类物质，下列分类标准不正确的是（　　）</p><p style="color: #1F2937; font-size: 11.5pt; line-height: 1.5; margin: 0 14pt;">A．钠的化合物　B．纯净物　C．钠盐　D．无机物</p>
        <p style="color: #B45309; font-size: 12pt; font-weight: bold; margin: 6pt 14pt 9pt 14pt;">答案：C</p>

      <div style="background: #FFFFFF; border: 1pt solid #DDD6C8; border-radius: 8pt; margin-bottom: 10pt;">
        <div style="margin-top: 9pt;"></div>
        <p style="color: #1F2937; font-size: 11.5pt; line-height: 1.5; margin: 0 14pt;">2．已知由碳元素组成的单质有金刚石、石墨和足球烯（C₆₀）等，由氧元素组成的单质有O₂和O₃，下列说法不正确的是（　　）</p><p style="color: #1F2937; font-size: 11.5pt; line-height: 1.5; margin: 0 14pt;">A．一种元素可能形成两种或两种以上不同的单质</p><p style="color: #1F2937; font-size: 11.5pt; line-height: 1.5; margin: 0 14pt;">B．单质的种类一定多于元素的种类</p><p style="color: #1F2937; font-size: 11.5pt; line-height: 1.5; margin: 0 14pt;">C．由同一种元素形成的几种单质互为同素异形体</p><p style="color: #1F2937; font-size: 11.5pt; line-height: 1.5; margin: 0 14pt;">D．金刚石、石墨和足球烯（C₆₀）在氧气中燃烧都只能生成一种物质</p>
        <p style="color: #B45309; font-size: 12pt; font-weight: bold; margin: 6pt 14pt 9pt 14pt;">答案：D</p>
