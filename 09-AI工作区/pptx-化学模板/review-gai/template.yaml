# reskin2 设计规范 —— 墨绿+米白 编辑式
# 引擎读取本文件，对"任意"PPT逐页重绘统一皮肤；不改文字/图片/位置。
name: 墨绿+米白 编辑式
design: editorial-green

colors:
  paper: "FAF7F0"        # 内容页 米白纸感底
  green: "1B4332"        # 墨绿主色（左侧竖条 / 标题块）
  green2: "2D6A4F"       # 辅助绿（进度 / 次级）
  amber: "E8A33D"        # 琥珀强调（标题下细线 / 进度）
  line_light: "DDE5DD"   # 浅底页 分隔线
  line_dark: "FFFFFF"    # 深底页 分隔线
  page_light: "6B7280"   # 浅底页 页码
  page_dark: "EDEDED"    # 深底页 页码
  cream: "FAF7F0"        # 深底页 标题文字

fonts:
  ea: "微软雅黑"
  latin_to: "Arial"
  # 仅当 latin 命中以下(衬线/旧字体)时才替换为 latin_to；其余原样保留，避免折行
  latin_replace:
    - "Times New Roman"
    - "SimSun"
    - "宋体"
    - "KaiTi"
    - "楷体"
    - "SimHei"
    - "黑体"
    - "Cambria"
    - "Calibri"
    - "等线"
    - "DengXian"
  # 这些字体一律不动（数学/符号字体容易改坏）
  skip:
    - "+mn-ea"
    - "+mn-lt"
    - "+mn-cs"
    - "Symbol"
    - "Wingdings"
    - "Wingdings 2"
    - "Wingdings 3"
    - "Webdings"
    - "MT Extra"

# 外壳几何：占画布比例(0~1)，运行时乘以实际 sldSz
geometry:
  spine:      {x: 0.0,   y: 0.0,   w: 0.011, h: 1.0}      # 左侧墨绿竖条（全高）
  progress:   {x: 0.011, w: 0.0045}                       # 竖条右侧进度（底对齐，高度=页码比例）
  green_dot:  {x: 0.060, y: 0.112, w: 0.012, h: 0.022}    # 标题区绿点
  amber_rule: {x: 0.085, y: 0.123, w: 0.160, h: 0.004}    # 标题下琥珀细线
  footer_div: {x: 0.060, y: 0.945, w: 0.880, h: 0.0012}   # 页脚分隔线
  page_num:   {x: 0.860, y: 0.950, w: 0.100, h: 0.030, size: 1000}  # 右下页码

pages:
  title_full_bleed: true          # 标题/章节页：满版墨绿
  title_text_to_cream: true        # 标题/章节页：文字转米白（保证绿底可读）
  title_last_slide: true           # 末页（致谢/结束）也按标题页处理
  title_layout_names: ["自定义版式"] # 版式名精确匹配（按课件而定，可留空）
  respect_dark_content_bg: true    # 内容页若本就是深底，则保留其底色
  dark_luminance_threshold: 0.60    # 感知亮度低于此值视为深底
