<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>开学第一课 · 放映</title>
<style>
  html, body { margin: 0; height: 100%; background: #1B4332; overflow: hidden;
    font-family: "Microsoft YaHei", Arial, sans-serif; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #frame { width: 960px; height: 540px; border: 0; display: block;
    transform-origin: center center; box-shadow: 0 8px 40px rgba(0,0,0,0.45); background: #FAF7F0; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 44px;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    background: rgba(27,67,50,0.92); }
  #bar button { background: #E8A33D; color: #1B4332; border: 0; border-radius: 5px;
    font-size: 15px; font-weight: bold; padding: 6px 18px; cursor: pointer; font-family: inherit; }
  #bar button:disabled { background: #6B7280; color: #D9D2C4; cursor: default; }
  #bar a { color: #9DB8A9; font-size: 12px; text-decoration: none; }
  #bar a:hover { color: #E8A33D; }
  #page { color: #FAF7F0; font-size: 13px; min-width: 64px; text-align: center; }
</style>
</head>
<body>
  <div id="stage"><iframe id="frame" src="slides/01-cover.html"></iframe></div>
  <div id="bar">
    <a href="overview.html">总览</a>
    <button id="prev">‹ 上一页</button>
    <span id="page">1 / 25</span>
    <button id="next">下一页 ›</button>
  </div>
<script>
const FILES = [
  '01-cover.html', '02-daily.html', '03-agri.html', '04-what.html', '05-three.html',
  '06-table-story.html', '07-nobel.html', '08-central.html', '09-medicine.html', '10-material.html',
  '11-rare-earth.html', '12-safety.html', '13-beauty.html', '14-summary.html', '15-junior.html',
  '16-content.html', '17-thinking.html', '18-method.html', '19-traps.html', '20-class.html',
  '21-notebooks.html', '22-loop.html', '23-mindset.html', '24-words.html', '25-homework.html'
];
const frame = document.getElementById('frame');
const pageEl = document.getElementById('page');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
let cur = 0;

function show(i, pushHash = true) {
  cur = Math.max(0, Math.min(FILES.length - 1, i));
  frame.src = 'slides/' + FILES[cur];
  pageEl.textContent = (cur + 1) + ' / ' + FILES.length;
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === FILES.length - 1;
  if (pushHash) history.replaceState(null, '', '#' + (cur + 1));
}

function fit() {
  const barH = 44;
  const s = Math.min(window.innerWidth / 960, (window.innerHeight - barH) / 540) * 0.98;
  const stage = document.getElementById('stage');
  stage.style.width = 960 * s + 'px';
  stage.style.height = 540 * s + 'px';
  frame.style.transform = 'scale(' + s + ')';
  frame.style.width = '960px';
  frame.style.height = '540px';
  // transform 缩放不影响占位，手动让 iframe 以左上角为原点缩进 stage
  frame.style.transformOrigin = 'top left';
}

prevBtn.onclick = () => show(cur - 1);
nextBtn.onclick = () => show(cur + 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') show(cur - 1);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') show(cur + 1);
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(FILES.length - 1);
});
window.addEventListener('resize', fit);

const h = parseInt((location.hash || '').replace('#', ''), 10);
show(isNaN(h) ? 0 : h - 1, false);
fit();
</script>
</body>
</html>
