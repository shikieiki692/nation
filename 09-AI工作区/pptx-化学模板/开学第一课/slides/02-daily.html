<!DOCTYPE html>
<html>
<head>

<style>

body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;

  font-family: "Microsoft YaHei", Arial, sans-serif;
  display: flex; flex-direction: column;
}
p, h1, ul { margin: 0; }
</style>
</head>
<body>
  <div style="position: absolute; left: 0; top: 0; width: 8pt; height: 405pt; background: #1B4332;"></div>
  <div style="position: absolute; left: 0; top: 381pt; width: 8pt; height: 24pt; background: #E8A33D;"></div>

      <p style="color: #FFFFFF; font-size: 10pt; font-weight: bold; margin: 2.5pt 7pt;">导入</p>

    <h1 style="color: #1B4332; font-size: 26pt; font-weight: bold; margin-left: 12pt; width: 500pt;">你身边有化学吗？</h1>

  <div style="position: relative; margin: 4pt 40pt 0 40pt; width: 640pt; height: 2.5pt;">

  </div>
  <div style="position: relative; margin: 14pt 40pt 0 40pt; width: 640pt; flex: 1;">
    <div style="display: flex; justify-content: space-between; margin-top: 12pt;">
      <div style="width: 200pt; background: #FFFFFF; border: 1pt solid #DDD6C8; border-radius: 8pt; box-shadow: 2px 2px 8px rgba(0,0,0,0.10);">
        <div style="margin: 8pt 8pt 0 8pt;"><img src="../images/card-bubble-tea.png" style="width: 184pt; height: 150pt;"></div>

      </div>
      <div style="width: 200pt; background: #FFFFFF; border: 1pt solid #DDD6C8; border-radius: 8pt; box-shadow: 2px 2px 8px rgba(0,0,0,0.10);">

        <p style="color: #1F2937; font-size: 13.5pt; line-height: 1.4; margin: 8pt 12pt 12pt 12pt;"><span style="font-weight: bold; color: #1B4332;">手机</span>：锂电池、屏幕玻璃、芯片，全是材料</p>
      </div>
      <div style="width: 200pt; background: #FFFFFF; border: 1pt solid #DDD6C8; border-radius: 8pt; box-shadow: 2px 2px 8px rgba(0,0,0,0.10);">
        <div style="margin: 8pt 8pt 0 8pt;"><img src="../images/card-extinguisher.png" style="width: 184pt; height: 150pt;"></div>

      </div>
