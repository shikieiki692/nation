<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { background: #FAF7F0; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FAF7F0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  display: flex; flex-direction: column;
}
p, h1, ul { margin: 0; }
</style>
</head>
<body>
  <div style="position: absolute; left: 0; top: 0; width: 8pt; height: 405pt; background: #1B4332;"></div>
  <div style="position: absolute; left: 0; top: 100pt; width: 8pt; height: 305pt; background: #E8A33D;"></div>
  <img src="../../icons/hex-corner.png" style="position: absolute; right: 0; top: 0; width: 180pt; height: 150pt;">
  <div style="margin: 16pt 40pt 0 40pt; width: 640pt; height: 34pt; display: flex; align-items: center;">
    <img src="../../icons/LuNotebookPen-1B4332.png" style="width: 16pt; height: 16pt;">
    <div style="background: #E8A33D; border-radius: 3pt; margin-left: 8pt; display: flex; justify-content: center;">
      <p style="color: #FFFFFF; font-size: 10pt; font-weight: bold; margin: 2.5pt 7pt;">怎么学好</p>
    </div>
    <h1 style="color: #1B4332; font-size: 26pt; font-weight: bold; margin-left: 12pt; width: 500pt;">两个本子</h1>
  </div>
  <div style="position: relative; margin: 4pt 40pt 0 40pt; width: 640pt; height: 2.5pt;">
    <div style="position: absolute; left: 0; top: 0.75pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
    <div style="position: absolute; left: 0; top: 0; width: 44pt; height: 2.5pt; background: #E8A33D;"></div>
  </div>
  <div style="position: relative; margin: 14pt 40pt 0 40pt; width: 640pt; flex: 1;">
    <div style="display: flex; justify-content: space-between; margin-top: 28pt;">
      <div style="width: 305pt; background: #FFFFFF; border: 1pt solid #DDD6C8; border-radius: 8pt; box-shadow: 2px 2px 8px rgba(0,0,0,0.10);">
        <div style="background: #1B4332; height: 40pt; border-radius: 7pt 7pt 0 0; display: flex; align-items: center; justify-content: center;">
          <img src="../../icons/LuNotebookPen-FFFFFF.png" style="width: 15pt; height: 15pt;">
          <p style="color: #FFFFFF; font-size: 16pt; font-weight: bold; margin-left: 8pt;">笔记本</p>
        </div>
        <p style="color: #1F2937; font-size: 14pt; line-height: 1.55; text-align: center; margin: 18pt 18pt 22pt 18pt;">记课堂要点——概念、方法、易错点；只记关键，不抄板书，留出动脑的余地</p>
      </div>
      <div style="width: 305pt; background: #FFFFFF; border: 1pt solid #DDD6C8; border-radius: 8pt; box-shadow: 2px 2px 8px rgba(0,0,0,0.10);">
        <div style="background: #1B4332; height: 40pt; border-radius: 7pt 7pt 0 0; display: flex; align-items: center; justify-content: center;">
          <img src="../../icons/LuPenLine-FFFFFF.png" style="width: 15pt; height: 15pt;">
          <p style="color: #FFFFFF; font-size: 16pt; font-weight: bold; margin-left: 8pt;">错题本</p>
        </div>
        <p style="color: #1F2937; font-size: 14pt; line-height: 1.55; text-align: center; margin: 18pt 18pt 22pt 18pt;">积累错题——错在哪、为什么错；每周翻一次，同类错误不犯第二次</p>
      </div>
    </div>
    <p style="position: absolute; left: 0; top: 280pt; width: 640pt; text-align: center; color: #6B7280; font-size: 13pt;">别等到第一次考试之后，好习惯从第一节课就开始</p>
  </div>
  <div style="position: absolute; left: 40pt; top: 384pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
  <p style="position: absolute; right: 40pt; top: 388pt; width: 80pt; text-align: right; color: #6B7280; font-size: 10pt;">21 / 25</p>
