<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { background: #FAF7F0; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FAF7F0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  display: flex; flex-direction: column;
}
p, h1, ul { margin: 0; }
</style>
</head>
<body>
  <div style="position: absolute; left: 0; top: 0; width: 8pt; height: 405pt; background: #1B4332;"></div>
  <div style="position: absolute; left: 0; top: 85pt; width: 8pt; height: 320pt; background: #E8A33D;"></div>
  <img src="../../icons/hex-corner.png" style="position: absolute; right: 0; top: 0; width: 180pt; height: 150pt;">
  <div style="margin: 16pt 40pt 0 40pt; width: 640pt; height: 34pt; display: flex; align-items: center;">
    <img src="../../icons/LuRefreshCw-1B4332.png" style="width: 16pt; height: 16pt;">
    <div style="background: #E8A33D; border-radius: 3pt; margin-left: 8pt; display: flex; justify-content: center;">
      <p style="color: #FFFFFF; font-size: 10pt; font-weight: bold; margin: 2.5pt 7pt;">怎么学好</p>
    </div>
    <h1 style="color: #1B4332; font-size: 26pt; font-weight: bold; margin-left: 12pt; width: 500pt;">课前预习 + 课后复习</h1>
  </div>
  <div style="position: relative; margin: 4pt 40pt 0 40pt; width: 640pt; height: 2.5pt;">
    <div style="position: absolute; left: 0; top: 0.75pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
    <div style="position: absolute; left: 0; top: 0; width: 44pt; height: 2.5pt; background: #E8A33D;"></div>
  </div>
  <div style="position: relative; margin: 14pt 40pt 0 40pt; width: 640pt; flex: 1;">
    <div style="position: relative; margin-top: 32pt;">
      <div style="position: absolute; left: 100pt; top: 19pt; width: 440pt; height: 2pt; background: #2D6A4F;"></div>
      <div style="display: flex; justify-content: space-between;">
        <div style="width: 200pt; display: flex; flex-direction: column; align-items: center;">
          <div style="background: #1B4332; width: 40pt; height: 40pt; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <p style="color: #FAF7F0; font-size: 16pt; font-weight: bold;">1</p>
          </div>
          <div style="width: 188pt; margin-top: 12pt; background: #FFFFFF; border: 1pt solid #DDD6C8; border-radius: 5pt;">
            <p style="color: #1B4332; font-size: 15.5pt; font-weight: bold; text-align: center; margin-top: 12pt;">课前标疑问</p>
            <p style="color: #6B7280; font-size: 12.5pt; line-height: 1.45; text-align: center; margin: 6pt 10pt 14pt 10pt;">花 5 分钟翻一遍，标出看不懂的地方</p>
          </div>
        </div>
        <div style="width: 200pt; display: flex; flex-direction: column; align-items: center;">
          <div style="background: #1B4332; width: 40pt; height: 40pt; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <p style="color: #FAF7F0; font-size: 16pt; font-weight: bold;">2</p>
          </div>
          <div style="width: 188pt; margin-top: 12pt; background: #FFFFFF; border: 1pt solid #DDD6C8; border-radius: 5pt;">
            <p style="color: #1B4332; font-size: 15.5pt; font-weight: bold; text-align: center; margin-top: 12pt;">课上带着听</p>
            <p style="color: #6B7280; font-size: 12.5pt; line-height: 1.45; text-align: center; margin: 6pt 10pt 14pt 10pt;">带着问题听课，重点听自己的疑问</p>
          </div>
        </div>
        <div style="width: 200pt; display: flex; flex-direction: column; align-items: center;">
          <div style="background: #1B4332; width: 40pt; height: 40pt; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <p style="color: #FAF7F0; font-size: 16pt; font-weight: bold;">3</p>
          </div>
          <div style="width: 188pt; margin-top: 12pt; background: #FFFFFF; border: 1pt solid #DDD6C8; border-radius: 5pt;">
            <p style="color: #1B4332; font-size: 15.5pt; font-weight: bold; text-align: center; margin-top: 12pt;">课后当天清</p>
            <p style="color: #6B7280; font-size: 12.5pt; line-height: 1.45; text-align: center; margin: 6pt 10pt 14pt 10pt;">当天的疑问当天解决，不拖到明天</p>
          </div>
        </div>
      </div>
    </div>
    <p style="position: absolute; left: 0; top: 280pt; width: 640pt; text-align: center; color: #6B7280; font-size: 13pt;">每天课前 5 分钟、课后 10 分钟，换来课堂上听得懂</p>
  </div>
  <div style="position: absolute; left: 40pt; top: 384pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
  <p style="position: absolute; right: 40pt; top: 388pt; width: 80pt; text-align: right; color: #6B7280; font-size: 10pt;">22 / 25</p>
</body>
</html>
