<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { background: #FAF7F0; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FAF7F0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  display: flex; flex-direction: column;
}
p, h1, ul { margin: 0; }
</style>
</head>
<body>
  <div style="position: absolute; left: 0; top: 0; width: 8pt; height: 405pt; background: #1B4332;"></div>
  <div style="position: absolute; left: 0; top: 129pt; width: 8pt; height: 276pt; background: #E8A33D;"></div>
  <img src="../../icons/hex-corner.png" style="position: absolute; right: 0; top: 0; width: 180pt; height: 150pt;">
  <div style="margin: 16pt 40pt 0 40pt; width: 640pt; height: 34pt; display: flex; align-items: center;">
    <img src="../../icons/LuTriangleAlert-1B4332.png" style="width: 16pt; height: 16pt;">
    <div style="background: #E8A33D; border-radius: 3pt; margin-left: 8pt; display: flex; justify-content: center;">
      <p style="color: #FFFFFF; font-size: 10pt; font-weight: bold; margin: 2.5pt 7pt;">初高中过渡</p>
    </div>
    <h1 style="color: #1B4332; font-size: 26pt; font-weight: bold; margin-left: 12pt; width: 500pt;">三个「掉队」陷阱</h1>
  </div>
  <div style="position: relative; margin: 4pt 40pt 0 40pt; width: 640pt; height: 2.5pt;">
    <div style="position: absolute; left: 0; top: 0.75pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
    <div style="position: absolute; left: 0; top: 0; width: 44pt; height: 2.5pt; background: #E8A33D;"></div>
  </div>
  <div style="position: relative; margin: 14pt 40pt 0 40pt; width: 640pt; flex: 1;">
    <div style="display: flex; justify-content: space-between; margin-top: 22pt;">
      <div style="width: 200pt; background: #FBEAE8; border: 1.5pt solid #C0392B; border-radius: 8pt;">
        <div style="display: flex; align-items: center; justify-content: center; margin-top: 12pt;">
          <img src="../../icons/LuTriangleAlert-C0392B.png" style="width: 15pt; height: 15pt;">
          <p style="color: #C0392B; font-size: 15pt; font-weight: bold; margin-left: 7pt;">只背不思考</p>
        </div>
        <p style="color: #1F2937; font-size: 12pt; line-height: 1.4; text-align: center; margin: 8pt 14pt 0 14pt;">背得滚瓜烂熟，一换情境就不会</p>
        <p style="color: #1B4332; font-size: 12pt; line-height: 1.4; margin: 10pt 14pt 14pt 14pt;"><span style="font-weight: bold;">破解：</span>多问一句「为什么」，把结论还原成推理过程</p>
      </div>
      <div style="width: 200pt; background: #FBEAE8; border: 1.5pt solid #C0392B; border-radius: 8pt;">
        <div style="display: flex; align-items: center; justify-content: center; margin-top: 12pt;">
          <img src="../../icons/LuTriangleAlert-C0392B.png" style="width: 15pt; height: 15pt;">
          <p style="color: #C0392B; font-size: 15pt; font-weight: bold; margin-left: 7pt;">攒问题不问</p>
        </div>
        <p style="color: #1F2937; font-size: 12pt; line-height: 1.4; text-align: center; margin: 8pt 14pt 0 14pt;">小问题攒成大窟窿</p>
        <p style="color: #1B4332; font-size: 12pt; line-height: 1.4; margin: 10pt 14pt 14pt 14pt;"><span style="font-weight: bold;">破解：</span>当天问，当天清；问老师、问同学，问题不过夜</p>
      </div>
      <div style="width: 200pt; background: #FBEAE8; border: 1.5pt solid #C0392B; border-radius: 8pt;">
        <div style="display: flex; align-items: center; justify-content: center; margin-top: 12pt;">
          <img src="../../icons/LuTriangleAlert-C0392B.png" style="width: 15pt; height: 15pt;">
          <p style="color: #C0392B; font-size: 15pt; font-weight: bold; margin-left: 7pt;">怕计算</p>
        </div>
        <p style="color: #1F2937; font-size: 12pt; line-height: 1.4; text-align: center; margin: 8pt 14pt 0 14pt;">一看到数字题就想跳过</p>
        <p style="color: #1B4332; font-size: 12pt; line-height: 1.4; margin: 10pt 14pt 14pt 14pt;"><span style="font-weight: bold;">破解：</span>跟着例题一步步算；计算题套路固定，动手三遍就熟</p>
      </div>
    </div>
    <p style="position: absolute; left: 0; top: 280pt; width: 640pt; text-align: center; color: #6B7280; font-size: 13pt;">这三个坑避开了，高一化学就稳了一半</p>
  </div>
  <div style="position: absolute; left: 40pt; top: 384pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
  <p style="position: absolute; right: 40pt; top: 388pt; width: 80pt; text-align: right; color: #6B7280; font-size: 10pt;">19 / 25</p>
</body>
</html>
