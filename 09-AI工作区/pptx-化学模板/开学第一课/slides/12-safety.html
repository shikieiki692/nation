<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { background: #FAF7F0; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FAF7F0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  display: flex; flex-direction: column;
}
p, h1, ul { margin: 0; }
</style>
</head>
<body>
  <div style="position: absolute; left: 0; top: 0; width: 8pt; height: 405pt; background: #1B4332;"></div>
  <div style="position: absolute; left: 0; top: 233pt; width: 8pt; height: 172pt; background: #E8A33D;"></div>
  <img src="../../icons/hex-corner.png" style="position: absolute; right: 0; top: 0; width: 180pt; height: 150pt;">
  <div style="margin: 16pt 40pt 0 40pt; width: 640pt; height: 34pt; display: flex; align-items: center;">
    <img src="../../icons/LuHeartPulse-1B4332.png" style="width: 16pt; height: 16pt;">
    <div style="background: #E8A33D; border-radius: 3pt; margin-left: 8pt; display: flex; justify-content: center;">
      <p style="color: #FFFFFF; font-size: 10pt; font-weight: bold; margin: 2.5pt 7pt;">为什么学</p>
    </div>
    <h1 style="color: #1B4332; font-size: 26pt; font-weight: bold; margin-left: 12pt; width: 500pt;">健康与安全</h1>
  </div>
  <div style="position: relative; margin: 4pt 40pt 0 40pt; width: 640pt; height: 2.5pt;">
    <div style="position: absolute; left: 0; top: 0.75pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
    <div style="position: absolute; left: 0; top: 0; width: 44pt; height: 2.5pt; background: #E8A33D;"></div>
  </div>
  <div style="position: relative; margin: 14pt 40pt 0 40pt; width: 640pt; flex: 1;">
    <div style="display: flex; justify-content: space-between; margin-top: 8pt;">
      <div style="width: 200pt; background: #FFFFFF; border: 1pt solid #DDD6C8; border-radius: 8pt; box-shadow: 2px 2px 8px rgba(0,0,0,0.08);">
        <div style="margin: 12pt 14pt 0 14pt;">
          <p style="color: #1B4332; font-size: 15pt; font-weight: bold;">铁</p>
          <p style="color: #2D6A4F; font-size: 12pt; font-weight: bold; margin-top: 2pt;">血红蛋白的核心成分</p>
          <p style="color: #6B7280; font-size: 11.5pt; line-height: 1.4; margin-top: 6pt; margin-bottom: 12pt;">缺铁容易贫血、疲劳；红肉、动物肝脏、菠菜能补</p>
        </div>
      </div>
      <div style="width: 200pt; background: #FFFFFF; border: 1pt solid #DDD6C8; border-radius: 8pt; box-shadow: 2px 2px 8px rgba(0,0,0,0.08);">
        <div style="margin: 12pt 14pt 0 14pt;">
          <p style="color: #1B4332; font-size: 15pt; font-weight: bold;">碘</p>
          <p style="color: #2D6A4F; font-size: 12pt; font-weight: bold; margin-top: 2pt;">甲状腺激素的原料</p>
          <p style="color: #6B7280; font-size: 11.5pt; line-height: 1.4; margin-top: 6pt; margin-bottom: 12pt;">缺碘会让甲状腺肿大；加碘盐就是为这个设计的</p>
        </div>
      </div>
      <div style="width: 200pt; background: #FFFFFF; border: 1pt solid #DDD6C8; border-radius: 8pt; box-shadow: 2px 2px 8px rgba(0,0,0,0.08);">
        <div style="margin: 12pt 14pt 0 14pt;">
          <p style="color: #1B4332; font-size: 15pt; font-weight: bold;">钙</p>
          <p style="color: #2D6A4F; font-size: 12pt; font-weight: bold; margin-top: 2pt;">骨骼和牙齿的主要成分</p>
          <p style="color: #6B7280; font-size: 11.5pt; line-height: 1.4; margin-top: 6pt; margin-bottom: 12pt;">长身体的关键期，奶、豆制品要跟上</p>
        </div>
      </div>
    </div>
    <div style="margin-top: 14pt; background: #FBEAE8; border: 1.5pt solid #C0392B; border-radius: 6pt;">
      <div style="display: flex; align-items: center; margin-top: 10pt;">
        <img src="../../icons/LuTriangleAlert-C0392B.png" style="width: 17pt; height: 17pt; margin-left: 12pt;">
        <p style="color: #C0392B; font-size: 15pt; font-weight: bold; margin-left: 8pt; width: 580pt;">84 消毒液 + 洁厕灵 = 有毒氯气</p>
      </div>
      <p style="color: #1B4332; font-size: 13.5pt; font-weight: bold; margin: 6pt 14pt 0 14pt;">NaClO + 2HCl ═ NaCl + H₂O + Cl₂↑</p>
      <p style="color: #1F2937; font-size: 12pt; line-height: 1.45; margin: 6pt 14pt;">84 含次氯酸钠（NaClO），洁厕灵含盐酸（HCl）——混用放出黄绿色、刺鼻的氯气，吸入会灼伤呼吸道。</p>
      <p style="color: #C0392B; font-size: 12pt; font-weight: bold; margin: 0 14pt 10pt 14pt;">记住两条：清洁剂绝不混用；闻到刺鼻气味，立刻开窗、离开现场</p>
    </div>
  </div>
  <div style="position: absolute; left: 40pt; top: 384pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
  <p style="position: absolute; right: 40pt; top: 388pt; width: 80pt; text-align: right; color: #6B7280; font-size: 10pt;">12 / 25</p>
</body>
