<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { background: #FAF7F0; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FAF7F0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  display: flex; flex-direction: column;
}
p, h1 { margin: 0; }
</style>
</head>
<body>
  <div style="position: absolute; left: 0; top: 0; width: 8pt; height: 405pt; background: #1B4332;"></div>
  <div style="position: absolute; left: 0; top: 253pt; width: 8pt; height: 152pt; background: #E8A33D;"></div>
  <img src="../icons/hex-corner.png" style="position: absolute; right: 0; top: 0; width: 180pt; height: 150pt;">
  <div style="margin: 16pt 40pt 0 40pt; width: 640pt; height: 34pt; display: flex; align-items: center;">
    <img src="../icons/LuSigma-1B4332.png" style="width: 16pt; height: 16pt;">
    <div style="background: #E8A33D; border-radius: 3pt; margin-left: 8pt; display: flex; justify-content: center;">
      <p style="color: #FFFFFF; font-size: 10pt; font-weight: bold; margin: 2.5pt 7pt;">推导与计算</p>
    </div>
    <h1 style="color: #1B4332; font-size: 26pt; font-weight: bold; margin-left: 12pt;">页标题占位</h1>
  </div>
  <div style="position: relative; margin: 4pt 40pt 0 40pt; width: 640pt; height: 2.5pt;">
    <div style="position: absolute; left: 0; top: 0.75pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
    <div style="position: absolute; left: 0; top: 0; width: 44pt; height: 2.5pt; background: #E8A33D;"></div>
  </div>

  <div style="position: relative; margin: 14pt 40pt 0 40pt; width: 640pt; flex: 1;">
    <!-- 竖向连接线 -->
    <div style="position: absolute; left: 13pt; top: 26pt; width: 2pt; height: 144pt; background: #2D6A4F;"></div>

    <!-- 步骤 1 已知条件 -->
    <div style="display: flex; align-items: flex-start; height: 56pt;">
      <div style="background: #1B4332; width: 28pt; height: 28pt; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <p style="color: #FAF7F0; font-size: 13pt; font-weight: bold;">1</p>
      </div>
      <div style="margin-left: 14pt;">
        <p style="color: #1B4332; font-size: 15pt; font-weight: bold;">已知条件</p>
        <p style="color: #1F2937; font-size: 14pt; margin-top: 3pt;">占位：列出题目给出的已知量与单位，如 <span style="font-weight: bold; color: #B45309;">m = 5.3 g</span></p>
      </div>
    </div>
    <!-- 步骤 2 公式 -->
    <div style="display: flex; align-items: flex-start; height: 56pt;">
      <div style="background: #1B4332; width: 28pt; height: 28pt; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <p style="color: #FAF7F0; font-size: 13pt; font-weight: bold;">2</p>
      </div>
      <div style="margin-left: 14pt;">
        <p style="color: #1B4332; font-size: 15pt; font-weight: bold;">公式</p>
        <p style="color: #1F2937; font-size: 14pt; margin-top: 3pt;">占位：写出所依据的公式或化学方程式</p>
      </div>
    </div>
    <!-- 步骤 3 代入数据 -->
    <div style="display: flex; align-items: flex-start; height: 56pt;">
      <div style="background: #1B4332; width: 28pt; height: 28pt; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <p style="color: #FAF7F0; font-size: 13pt; font-weight: bold;">3</p>
      </div>
      <div style="margin-left: 14pt;">
        <p style="color: #1B4332; font-size: 15pt; font-weight: bold;">代入数据</p>
        <p style="color: #1F2937; font-size: 14pt; margin-top: 3pt; width: 590pt;">占位：代入数据统一单位，如 <span style="font-weight: bold; color: #B45309;">n = 0.20 mol</span>，保留有效数字</p>
      </div>
    </div>
    <!-- 步骤 4 答案 -->
    <div style="display: flex; align-items: flex-start;">
      <div style="background: #1B4332; width: 28pt; height: 28pt; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <p style="color: #FAF7F0; font-size: 13pt; font-weight: bold;">4</p>
      </div>
      <div style="margin-left: 14pt; width: 560pt;">
        <p style="color: #1B4332; font-size: 15pt; font-weight: bold;">答案</p>
        <div style="background: #FBF0DA; border: 1.5pt solid #E8A33D; border-radius: 5pt; margin-top: 5pt;">
          <p style="color: #1F2937; font-size: 14pt; margin: 7pt 12pt;">占位：计算结果与结论，如 <span style="font-weight: bold; color: #B45309;">w = 32%</span>（保留两位有效数字）</p>
        </div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 40pt; top: 384pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
  <p style="position: absolute; right: 40pt; top: 388pt; width: 80pt; text-align: right; color: #6B7280; font-size: 10pt;">9 / 20</p>
</body>
</html>
