<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { background: #FAF7F0; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FAF7F0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  display: flex; flex-direction: column;
}
p, h1 { margin: 0; }
</style>
</head>
<body>
  <div style="position: absolute; left: 0; top: 0; width: 8pt; height: 405pt; background: #1B4332;"></div>
  <div style="position: absolute; left: 0; top: 147pt; width: 8pt; height: 258pt; background: #E8A33D;"></div>
  <img src="../icons/hex-corner.png" style="position: absolute; right: 0; top: 0; width: 180pt; height: 150pt;">
  <div style="margin: 16pt 40pt 0 40pt; width: 640pt; height: 34pt; display: flex; align-items: center;">
    <img src="../icons/LuNetwork-1B4332.png" style="width: 16pt; height: 16pt;">
    <div style="background: #E8A33D; border-radius: 3pt; margin-left: 8pt; display: flex; justify-content: center;">
      <p style="color: #FFFFFF; font-size: 10pt; font-weight: bold; margin: 2.5pt 7pt;">知识框架</p>
    </div>
    <h1 style="color: #1B4332; font-size: 26pt; font-weight: bold; margin-left: 12pt;">页标题占位</h1>
  </div>
  <div style="position: relative; margin: 4pt 40pt 0 40pt; width: 640pt; height: 2.5pt;">
    <div style="position: absolute; left: 0; top: 0.75pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
    <div style="position: absolute; left: 0; top: 0; width: 44pt; height: 2.5pt; background: #E8A33D;"></div>
  </div>

  <div style="position: relative; margin: 14pt 40pt 0 40pt; width: 640pt; flex: 1;">
    <!-- 连接线（先画线，节点在上层） -->
    <div style="position: absolute; left: 140pt; top: 124pt; width: 70pt; height: 2pt; background: #2D6A4F;"></div>
    <div style="position: absolute; left: 210pt; top: 38pt; width: 2pt; height: 174pt; background: #2D6A4F;"></div>
    <div style="position: absolute; left: 210pt; top: 37pt; width: 70pt; height: 2pt; background: #2D6A4F;"></div>
    <div style="position: absolute; left: 210pt; top: 124pt; width: 70pt; height: 2pt; background: #2D6A4F;"></div>
    <div style="position: absolute; left: 210pt; top: 211pt; width: 70pt; height: 2pt; background: #2D6A4F;"></div>
    <div style="position: absolute; left: 410pt; top: 37pt; width: 110pt; height: 2pt; background: #2D6A4F;"></div>
    <div style="position: absolute; left: 410pt; top: 124pt; width: 110pt; height: 2pt; background: #2D6A4F;"></div>
    <div style="position: absolute; left: 410pt; top: 211pt; width: 110pt; height: 2pt; background: #2D6A4F;"></div>

    <!-- 中心主题节点 -->
    <div style="position: absolute; left: 20pt; top: 103pt; width: 120pt; height: 44pt; background: #1B4332; border-radius: 8pt; display: flex; align-items: center; justify-content: center;">
      <p style="color: #FAF7F0; font-size: 15pt; font-weight: bold;">主题占位</p>
    </div>
    <!-- 一级分支 -->
    <div style="position: absolute; left: 280pt; top: 20pt; width: 130pt; height: 36pt; background: #FFFFFF; border: 2pt solid #2D6A4F; border-radius: 8pt; display: flex; align-items: center; justify-content: center;">
      <p style="color: #1B4332; font-size: 14pt; font-weight: bold;">分支一占位</p>
    </div>
    <div style="position: absolute; left: 280pt; top: 107pt; width: 130pt; height: 36pt; background: #FFFFFF; border: 2pt solid #2D6A4F; border-radius: 8pt; display: flex; align-items: center; justify-content: center;">
      <p style="color: #1B4332; font-size: 14pt; font-weight: bold;">分支二占位</p>
    </div>
    <div style="position: absolute; left: 280pt; top: 194pt; width: 130pt; height: 36pt; background: #FFFFFF; border: 2pt solid #2D6A4F; border-radius: 8pt; display: flex; align-items: center; justify-content: center;">
      <p style="color: #1B4332; font-size: 14pt; font-weight: bold;">分支三占位</p>
    </div>
    <!-- 二级节点 -->
    <div style="position: absolute; left: 520pt; top: 22pt; width: 120pt; height: 32pt; background: #E3EDE6; border-radius: 6pt; display: flex; align-items: center; justify-content: center;">
      <p style="color: #1F2937; font-size: 13pt;">二级节点</p>
    </div>
    <div style="position: absolute; left: 520pt; top: 109pt; width: 120pt; height: 32pt; background: #E3EDE6; border-radius: 6pt; display: flex; align-items: center; justify-content: center;">
      <p style="color: #1F2937; font-size: 13pt;">二级节点</p>
    </div>
    <div style="position: absolute; left: 520pt; top: 196pt; width: 120pt; height: 32pt; background: #E3EDE6; border-radius: 6pt; display: flex; align-items: center; justify-content: center;">
      <p style="color: #1F2937; font-size: 13pt;">二级节点</p>
    </div>
  </div>

  <div style="position: absolute; left: 40pt; top: 384pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
  <p style="position: absolute; right: 40pt; top: 388pt; width: 80pt; text-align: right; color: #6B7280; font-size: 10pt;">14 / 20</p>
</body>
</html>
