<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { background: #FAF7F0; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FAF7F0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  display: flex; flex-direction: column;
}
p, h1 { margin: 0; }
</style>
</head>
<body>
  <div style="position: absolute; left: 0; top: 0; width: 8pt; height: 405pt; background: #1B4332;"></div>
  <div style="position: absolute; left: 0; top: 381pt; width: 8pt; height: 24pt; background: #E8A33D;"></div>
  <img src="../icons/hex-corner.png" style="position: absolute; right: 0; top: 0; width: 180pt; height: 150pt;">
  <div style="margin: 16pt 40pt 0 40pt; width: 640pt; height: 34pt; display: flex; align-items: center;">
    <img src="../icons/LuBookOpen-1B4332.png" style="width: 16pt; height: 16pt;">
    <div style="background: #E8A33D; border-radius: 3pt; margin-left: 8pt; display: flex; justify-content: center;">
      <p style="color: #FFFFFF; font-size: 10pt; font-weight: bold; margin: 2.5pt 7pt;">使用说明</p>
    </div>
    <h1 style="color: #1B4332; font-size: 26pt; font-weight: bold; margin-left: 12pt;">模板使用说明</h1>
  </div>
  <div style="position: relative; margin: 4pt 40pt 0 40pt; width: 640pt; height: 2.5pt;">
    <div style="position: absolute; left: 0; top: 0.75pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
    <div style="position: absolute; left: 0; top: 0; width: 44pt; height: 2.5pt; background: #E8A33D;"></div>
  </div>

  <!-- 色板 -->
  <div style="margin: 14pt 40pt 0 40pt; width: 640pt;">
    <p style="color: #1B4332; font-size: 14pt; font-weight: bold;">语义色板（60-30-10：米白底 / 墨绿结构 / 橙黄点缀）</p>
    <div style="display: flex; margin-top: 8pt;">
      <div style="width: 98pt;">
        <div style="width: 88pt; height: 40pt; background: #1B4332; border-radius: 5pt;"></div>
        <p style="color: #1F2937; font-size: 11pt; font-weight: bold; margin-top: 4pt;">主色墨绿</p>
        <p style="color: #6B7280; font-size: 10pt;">#1B4332</p>
      </div>
      <div style="width: 98pt;">
        <div style="width: 88pt; height: 40pt; background: #2D6A4F; border-radius: 5pt;"></div>
        <p style="color: #1F2937; font-size: 11pt; font-weight: bold; margin-top: 4pt;">中绿辅助</p>
        <p style="color: #6B7280; font-size: 10pt;">#2D6A4F</p>
      </div>
      <div style="width: 98pt;">
        <div style="width: 88pt; height: 40pt; background: #E8A33D; border-radius: 5pt;"></div>
        <p style="color: #1F2937; font-size: 11pt; font-weight: bold; margin-top: 4pt;">橙黄强调</p>
        <p style="color: #6B7280; font-size: 10pt;">#E8A33D</p>
      </div>
      <div style="width: 98pt;">
        <div style="width: 88pt; height: 40pt; background: #B45309; border-radius: 5pt;"></div>
        <p style="color: #1F2937; font-size: 11pt; font-weight: bold; margin-top: 4pt;">深橙文字</p>
        <p style="color: #6B7280; font-size: 10pt;">#B45309</p>
      </div>
      <div style="width: 98pt;">
        <div style="width: 88pt; height: 40pt; background: #C0392B; border-radius: 5pt;"></div>
        <p style="color: #1F2937; font-size: 11pt; font-weight: bold; margin-top: 4pt;">砖红警示</p>
        <p style="color: #6B7280; font-size: 10pt;">#C0392B</p>
      </div>
      <div style="width: 98pt;">
        <div style="width: 88pt; height: 40pt; background: #FAF7F0; border: 1pt solid #D9D2C4; border-radius: 5pt;"></div>
        <p style="color: #1F2937; font-size: 11pt; font-weight: bold; margin-top: 4pt;">米白底色</p>
        <p style="color: #6B7280; font-size: 10pt;">#FAF7F0</p>
      </div>
    </div>
  </div>

  <!-- 字号 + 图标两行 -->
  <div style="display: flex; margin: 16pt 40pt 0 40pt; width: 640pt; flex: 1;">
    <div style="width: 330pt;">
      <p style="color: #1B4332; font-size: 14pt; font-weight: bold;">字号层级</p>
      <p style="color: #1B4332; font-size: 26pt; font-weight: bold; margin-top: 6pt;">页标题 26pt</p>
      <p style="color: #1F2937; font-size: 16pt; margin-top: 6pt;">正文 16-18pt，每页要点不超过 5 条</p>
      <p style="color: #6B7280; font-size: 11.5pt; margin-top: 6pt;">注释 / 页脚 11-12pt（说明性正文不低于 14pt）</p>
    </div>
    <div style="width: 290pt; margin-left: 20pt;">
      <p style="color: #1B4332; font-size: 14pt; font-weight: bold;">图标使用</p>
      <p style="color: #1F2937; font-size: 14pt; margin-top: 8pt; width: 280pt;">功能标签 = 图标 + 文字（2px 线宽）</p>
      <div style="display: flex; align-items: center; margin-top: 10pt;">
        <img src="../icons/LuLightbulb-B45309.png" style="width: 16pt; height: 16pt;">
        <p style="color: #1F2937; font-size: 14pt; margin-left: 8pt; width: 42pt;">提示</p>
        <img src="../icons/LuTriangleAlert-C0392B.png" style="width: 16pt; height: 16pt; margin-left: 28pt;">
        <p style="color: #C0392B; font-size: 14pt; font-weight: bold; margin-left: 8pt; width: 100pt;">警示专用砖红</p>
      </div>
      <p style="color: #6B7280; font-size: 11.5pt; margin-top: 10pt;">正确 = 主绿；警示 = 砖红；全片禁用蓝色</p>
    </div>
  </div>

  <div style="position: absolute; left: 40pt; top: 384pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
  <p style="position: absolute; right: 40pt; top: 388pt; width: 80pt; text-align: right; color: #6B7280; font-size: 10pt;">2 / 20</p>
</body>
</html>
