<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { background: #FAF7F0; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FAF7F0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  display: flex; flex-direction: column;
}
p, h1, ul { margin: 0; }
</style>
</head>
<body>
  <div style="position: absolute; left: 0; top: 0; width: 8pt; height: 405pt; background: #1B4332;"></div>
  <div style="position: absolute; left: 0; top: 274pt; width: 8pt; height: 131pt; background: #E8A33D;"></div>
  <img src="../icons/hex-corner.png" style="position: absolute; right: 0; top: 0; width: 180pt; height: 150pt;">
  <div style="margin: 16pt 40pt 0 40pt; width: 640pt; height: 34pt; display: flex; align-items: center;">
    <img src="../icons/LuSearch-1B4332.png" style="width: 16pt; height: 16pt;">
    <div style="background: #E8A33D; border-radius: 3pt; margin-left: 8pt; display: flex; justify-content: center;">
      <p style="color: #FFFFFF; font-size: 10pt; font-weight: bold; margin: 2.5pt 7pt;">微观探析</p>
    </div>
    <h1 style="color: #1B4332; font-size: 26pt; font-weight: bold; margin-left: 12pt;">页标题占位</h1>
  </div>
  <div style="position: relative; margin: 4pt 40pt 0 40pt; width: 640pt; height: 2.5pt;">
    <div style="position: absolute; left: 0; top: 0.75pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
    <div style="position: absolute; left: 0; top: 0; width: 44pt; height: 2.5pt; background: #E8A33D;"></div>
  </div>

  <div style="display: flex; margin: 14pt 40pt 0 40pt; width: 640pt; flex: 1;">
    <!-- 左侧大图占位（≥60%） -->
    <div style="position: relative; width: 400pt; height: 236pt; background: #E3EDE6; border: 1pt solid #B7CDBF; border-radius: 8pt; display: flex; align-items: center; justify-content: center;">
      <p style="color: #6B7280; font-size: 14pt; width: 300pt; text-align: center;">晶胞 / 分子模型图占位</p>
      <!-- 四角引线标注示意 -->
      <div style="position: absolute; left: 12pt; top: 10pt; display: flex; align-items: center;">
        <p style="color: #1B4332; font-size: 10.5pt; font-weight: bold;">标注一</p>
        <div style="width: 26pt; height: 1pt; background: #6B7280; margin-left: 4pt;"></div>
      </div>
      <div style="position: absolute; right: 12pt; top: 10pt; display: flex; align-items: center;">
        <div style="width: 26pt; height: 1pt; background: #6B7280; margin-right: 4pt;"></div>
        <p style="color: #1B4332; font-size: 10.5pt; font-weight: bold;">标注二</p>
      </div>
      <div style="position: absolute; left: 12pt; bottom: 10pt; display: flex; align-items: center;">
        <p style="color: #1B4332; font-size: 10.5pt; font-weight: bold;">标注三</p>
        <div style="width: 26pt; height: 1pt; background: #6B7280; margin-left: 4pt;"></div>
      </div>
      <div style="position: absolute; right: 12pt; bottom: 10pt; display: flex; align-items: center;">
        <div style="width: 26pt; height: 1pt; background: #6B7280; margin-right: 4pt;"></div>
        <p style="color: #1B4332; font-size: 10.5pt; font-weight: bold;">标注四</p>
      </div>
    </div>

    <!-- 右侧宏观↔微观对照 -->
    <div style="width: 216pt; margin-left: 24pt;">
      <div style="background: #1B4332; border-radius: 4pt; display: flex; justify-content: center;">
        <p style="color: #FAF7F0; font-size: 13pt; font-weight: bold; margin: 5pt 0;">宏观</p>
      </div>
      <ul style="color: #1F2937; font-size: 14pt; line-height: 1.5; padding-left: 18pt; margin-top: 8pt;">
        <li style="margin-bottom: 6pt;">宏观现象占位要点一</li>
        <li>宏观现象占位要点二</li>
      </ul>
      <div style="background: #2D6A4F; border-radius: 4pt; display: flex; justify-content: center; margin-top: 14pt;">
        <p style="color: #FAF7F0; font-size: 13pt; font-weight: bold; margin: 5pt 0;">微观</p>
      </div>
      <ul style="color: #1F2937; font-size: 14pt; line-height: 1.5; padding-left: 18pt; margin-top: 8pt;">
        <li style="margin-bottom: 6pt;">微观解释占位要点一</li>
        <li>微观解释占位要点二</li>
      </ul>
    </div>
  </div>

  <div style="position: absolute; left: 40pt; top: 384pt; width: 640pt; height: 1pt; background: #DDE5DD;"></div>
  <p style="position: absolute; right: 40pt; top: 388pt; width: 80pt; text-align: right; color: #6B7280; font-size: 10pt;">8 / 20</p>
</body>
</html>
