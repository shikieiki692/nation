<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 40px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #1f2937; }
      .subtitle { font: 400 22px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #4b5563; }
      .stepTitle { font: 700 24px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #111827; }
      .stepBody { font: 400 20px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #374151; }
      .count { font: 700 28px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .boxTitle { font: 700 24px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #111827; }
      .boxBody { font: 400 20px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #374151; }
      .note { font: 400 18px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #4b5563; }
      .small { font: 400 17px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #4b5563; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>

  <text x="700" y="62" class="title" text-anchor="middle">等电子体结构迁移图</text>
  <text x="700" y="102" class="subtitle" text-anchor="middle">先判“原子数相同 + 价电子总数相同”，再借已知物种的构型与杂化</text>

  <rect x="60" y="140" width="470" height="94" rx="18" fill="#f3f4f6" stroke="#111827" stroke-width="3"/>
  <text x="92" y="178" class="stepTitle">Step 1 先数原子数</text>
  <text x="92" y="214" class="stepBody">二原子 / 三原子 / 四原子 / 五原子，先分桶</text>

  <line x1="295" y1="234" x2="295" y2="274" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="284" width="470" height="94" rx="18" fill="#f9fafb" stroke="#111827" stroke-width="3"/>
  <text x="92" y="322" class="stepTitle">Step 2 再算总价电子数</text>
  <text x="92" y="358" class="stepBody">把离子电荷一并算进去，别只看中心原子</text>

  <line x1="295" y1="378" x2="295" y2="418" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="428" width="470" height="94" rx="18" fill="#f3f4f6" stroke="#111827" stroke-width="3"/>
  <text x="92" y="466" class="stepTitle">Step 3 在已知序列里匹配</text>
  <text x="92" y="502" class="stepBody">同原子数 + 同价电子数，优先迁移“构型 + 杂化”</text>

  <line x1="295" y1="522" x2="295" y2="562" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="572" width="470" height="124" rx="18" fill="#f9fafb" stroke="#111827" stroke-width="3"/>
  <text x="92" y="610" class="stepTitle">Step 4 再做细修正</text>
  <text x="92" y="646" class="stepBody">再回 Lewis / VSEPR 看形式电荷、孤对电子、</text>
  <text x="92" y="676" class="stepBody">是否共振离域，别把“相似”误当成“完全相同”</text>

  <rect x="60" y="746" width="1280" height="106" rx="20" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2.5"/>
  <text x="88" y="784" class="stepTitle">使用边界</text>
  <text x="88" y="820" class="note">等电子体最适合快速迁移第一层结论：直线 / V 形 / 平面三角 / 四面体、sp / sp² / sp³。</text>
  <text x="88" y="846" class="note">键长、极性、共振权重和真实电荷分布仍需回到具体分子重新判断。</text>

  <text x="610" y="152" class="boxTitle">常用等电子体序列</text>

  <circle cx="650" cy="214" r="34" fill="#374151"/>
  <text x="650" y="214" class="count">10e</text>
  <rect x="700" y="176" width="600" height="76" rx="16" fill="#f9fafb" stroke="#111827" stroke-width="2.5"/>
  <text x="728" y="208" class="boxTitle">二原子直线型</text>
  <text x="728" y="236" class="boxBody">CO、N₂、CN⁻、C₂²⁻  →  三键主导，线形</text>

  <circle cx="650" cy="320" r="34" fill="#374151"/>
  <text x="650" y="320" class="count">16e</text>
  <rect x="700" y="278" width="600" height="92" rx="16" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="728" y="310" class="boxTitle">三原子直线型</text>
  <text x="728" y="338" class="boxBody">BeCl₂、CO₂、N₂O、N₃⁻、NO₂⁺、CS₂</text>
  <text x="728" y="364" class="small">常见迁移：NCO⁻、SCN⁻ 也常从这一桶进入</text>

  <circle cx="650" cy="442" r="34" fill="#374151"/>
  <text x="650" y="442" class="count">18e</text>
  <rect x="700" y="404" width="600" height="76" rx="16" fill="#f9fafb" stroke="#111827" stroke-width="2.5"/>
  <text x="728" y="436" class="boxTitle">三原子 V 形</text>
  <text x="728" y="464" class="boxBody">SO₂、O₃、NO₂⁻  →  常见为 sp² 中心 + 1 对孤对</text>

  <circle cx="650" cy="548" r="34" fill="#374151"/>
  <text x="650" y="548" class="count">24e</text>
  <rect x="700" y="510" width="600" height="76" rx="16" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="728" y="542" class="boxTitle">四原子平面三角</text>
  <text x="728" y="570" class="boxBody">SO₃、NO₃⁻、CO₃²⁻、BF₃  →  常见为 sp² 中心</text>

  <circle cx="650" cy="654" r="34" fill="#374151"/>
  <text x="650" y="654" class="count">32e</text>
  <rect x="700" y="616" width="600" height="76" rx="16" fill="#f9fafb" stroke="#111827" stroke-width="2.5"/>
  <text x="728" y="648" class="boxTitle">五原子四面体</text>
  <text x="728" y="676" class="boxBody">PO₄³⁻、SO₄²⁻、ClO₄⁻、SiO₄⁴⁻  →  常见为 sp³ 中心</text>
</svg>
